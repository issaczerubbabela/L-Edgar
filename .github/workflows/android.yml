name: Android CI Build

on:
  push:
    branches: [ "main", "claude/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # The runner's JDK 17 throws a NullPointerException reading cgroup v2 limits
    # (CgroupV2Subsystem "anyController is null") when the Android Gradle plugin locks the
    # debug keystore. Skipping container detection avoids it and changes nothing else here.
    env:
      JAVA_TOOL_OPTIONS: -XX:-UseContainerSupport
    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'oracle'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Unit tests
      run: ./gradlew testDebugUnitTest

    - name: set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Apps Script tests
      run: node --test scripts/tests/bucket-budgets.test.js scripts/tests/transaction-sync.test.js

    - name: Build with Gradle
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
