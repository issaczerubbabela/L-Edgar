name: Release

# Push a tag such as v1.1.0 (it must match versionName in app/build.gradle.kts) to build a signed
# release APK and publish it as a GitHub Release, with that version's notes from CHANGELOG.md.
#
# Needs four repository secrets:
#   RELEASE_KEYSTORE_BASE64  the release keystore (.jks), base64-encoded
#   RELEASE_STORE_PASSWORD   the keystore password
#   RELEASE_KEY_ALIAS        the key alias inside it
#   RELEASE_KEY_PASSWORD     the key password
on:
  push:
    tags: [ "v*.*.*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v1.1.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check the tag matches the app version
        run: |
          version=$(grep -oP 'val appVersionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match versionName $version in app/build.gradle.kts"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Check the signing secrets are set
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE" ] && missing="$missing RELEASE_KEYSTORE_BASE64"
          [ -z "$STORE_PASSWORD" ] && missing="$missing RELEASE_STORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && missing="$missing RELEASE_KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ] && missing="$missing RELEASE_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. An unsigned APK can't update the installed app, so nothing was released."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'oracle'
          cache: gradle

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest

      - name: Apps Script tests
        run: node --test scripts/tests/bucket-budgets.test.js scripts/tests/transaction-sync.test.js

      - name: Build the signed release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RELEASE_STORE_FILE"
          ./gradlew assembleRelease
          rm -f "$RELEASE_STORE_FILE"

      - name: Verify the signature
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk" | grep -E "Signer #1 certificate (DN|SHA-256)"
          mkdir -p dist
          cp "$apk" "dist/ledgar-$TAG.apk"
          (cd dist && sha256sum "ledgar-$TAG.apk" > "ledgar-$TAG.apk.sha256")

      - name: Release notes from CHANGELOG.md
        run: |
          # The section for this version: from its "## [x.y.z]" heading up to the next "## [" heading.
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > dist/notes.md
          if [ ! -s dist/notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            --title "L.Edgar $TAG" \
            --notes-file dist/notes.md \
            "dist/ledgar-$TAG.apk" "dist/ledgar-$TAG.apk.sha256"
